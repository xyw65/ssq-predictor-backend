services:
  - type: web
    name: ssq-predictor-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
